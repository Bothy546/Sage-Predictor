name: Minimum APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Create ABSOLUTE MINIMUM App
      run: |
        cat > src/App.js << 'EOF'
        import React from 'react';
        import { Text } from 'react-native';
        
        export default function App() {
          return React.createElement(Text, null, 'WORKS');
        }
        EOF

    - name: Create Metro config
      run: |
        cat > metro.config.js << 'EOF'
        const {getDefaultConfig, mergeConfig} = require('@react-native/metro-config');
        module.exports = mergeConfig(getDefaultConfig(__dirname), {});
        EOF

    - name: Android files
      run: |
        cat > android/build.gradle << 'EOF'
        buildscript {
            ext {
                buildToolsVersion = "33.0.0"
                minSdkVersion = 21
                compileSdkVersion = 33
                targetSdkVersion = 33
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath('com.android.tools.build:gradle:7.4.2')
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url "$rootDir/../node_modules/react-native/android" }
                maven { url "$rootDir/../node_modules/jsc-android/dist" }
            }
        }
        EOF
        
        cat > android/settings.gradle << 'EOF'
        rootProject.name = 'SagePredictor'
        include ':app'
        EOF
        
        cat > android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4096m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

    - name: Java files
      run: |
        mkdir -p android/app/src/main/java/com/sagepredictor
        
        cat > android/app/src/main/java/com/sagepredictor/MainActivity.java << 'EOF'
        package com.sagepredictor;
        import com.facebook.react.ReactActivity;
        public class MainActivity extends ReactActivity {
          @Override
          protected String getMainComponentName() {
            return "SagePredictor";
          }
        }
        EOF
        
        cat > android/app/src/main/java/com/sagepredictor/MainApplication.java << 'EOF'
        package com.sagepredictor;
        import android.app.Application;
        import com.facebook.react.ReactApplication;
        import com.facebook.react.ReactNativeHost;
        import com.facebook.react.ReactPackage;
        import com.facebook.react.shell.MainReactPackage;
        import com.facebook.soloader.SoLoader;
        import java.util.Arrays;
        import java.util.List;
        
        public class MainApplication extends Application implements ReactApplication {
          private final ReactNativeHost mReactNativeHost = new ReactNativeHost(this) {
            @Override
            public boolean getUseDeveloperSupport() { return false; }
            @Override
            protected List<ReactPackage> getPackages() {
              return Arrays.asList(new MainReactPackage());
            }
            @Override
            protected String getJSMainModuleName() { return "index"; }
          };
          @Override
          public ReactNativeHost getReactNativeHost() { return mReactNativeHost; }
          @Override
          public void onCreate() {
            super.onCreate();
            SoLoader.init(this, false);
          }
        }
        EOF

    - name: Icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-mdpi
        sudo apt-get update -qq && sudo apt-get install -y imagemagick
        convert -size 48x48 xc:#4CAF50 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

    - name: Manifest
      run: |
        mkdir -p android/app/src/main/res/values
        echo '<resources><string name="app_name">Sage</string></resources>' > android/app/src/main/res/values/strings.xml
        
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sagepredictor">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:name=".MainApplication" android:label="@string/app_name" android:icon="@mipmap/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
        </manifest>
        EOF

    - name: Bundle
      run: |
        mkdir -p android/app/src/main/assets
        npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

    - name: Gradle
      run: |
        cd /tmp && wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip && unzip -q gradle-7.6.4-bin.zip
        cd $GITHUB_WORKSPACE/android && /tmp/gradle-7.6.4/bin/gradle wrapper --gradle-version=7.6.4 && chmod +x gradlew

    - name: Build
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android && ./gradlew assembleDebug --stacktrace

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk

        path: android/app/build/outputs/apk/debug/app-debug.apk
