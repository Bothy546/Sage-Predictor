name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Create app icons
      run: |
        # Create mipmap directories
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        
        # Install ImageMagick to create icons
        sudo apt-get update
        sudo apt-get install -y imagemagick
        
        # Create a simple green icon with "S" letter (Sage Predictor)
        convert -size 512x512 xc:#4CAF50 -pointsize 400 -fill white -gravity center -annotate +0+0 "S" android/app/src/main/res/ic_launcher_base.png
        
        # Resize for different densities
        convert android/app/src/main/res/ic_launcher_base.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        convert android/app/src/main/res/ic_launcher_base.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        convert android/app/src/main/res/ic_launcher_base.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        convert android/app/src/main/res/ic_launcher_base.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        convert android/app/src/main/res/ic_launcher_base.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        
        # Create round icons (same as regular for simplicity)
        cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        
        # Clean up
        rm android/app/src/main/res/ic_launcher_base.png

    - name: Create Gradle wrapper files
      run: |
        cd android
        mkdir -p gradle/wrapper
        
        # Download gradle-wrapper.jar
        wget -q https://raw.githubusercontent.com/gradle/gradle/v7.6.4/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        
        # Create gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << EOF
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.4-all.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Create gradlew script
        cat > gradlew << 'EOF'
        #!/bin/sh
        APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit
        CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
        exec "$JAVA_HOME/bin/java" "-Dorg.gradle.appname=gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        
        chmod +x gradlew

    - name: Create local.properties
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Create keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias sage-key -keyalg RSA -keysize 2048 -validity 10000 -storepass sage2024 -keypass sage2024 -dname "CN=Sage Predictor, OU=Dev, O=Sage, L=City, S=State, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sage-predictor-release

        path: android/app/build/outputs/apk/release/app-release.apk
