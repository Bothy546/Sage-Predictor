name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-node: '18'

    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        npm install -g react-native-cli

    - name: Create local.properties
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Download and setup Gradle 7.6.4
      run: |
        cd android
        wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
        unzip -q gradle-7.6.4-bin.zip
        gradle-7.6.4/bin/gradle wrapper --gradle-version=7.6.4
        chmod +x gradlew
        rm -rf gradle-7.6.4 gradle-7.6.4-bin.zip

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Create keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias sage-key -keyalg RSA -keysize 2048 -validity 10000 -storepass sage2024 -keypass sage2024 -dname "CN=Sage Predictor, OU=Dev, O=Sage, L=City, S=State, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew clean
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sage-predictor-release

        path: android/app/build/outputs/apk/release/app-release.apk
