name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Create Android build files
      run: |
        # Create build.gradle (project level)
        cat > android/build.gradle << 'EOF'
        buildscript {
            ext {
                buildToolsVersion = "33.0.0"
                minSdkVersion = 21
                compileSdkVersion = 33
                targetSdkVersion = 33
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath('com.android.tools.build:gradle:7.4.2')
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven {
                    url "$rootDir/../node_modules/react-native/android"
                }
                maven {
                    url "$rootDir/../node_modules/jsc-android/dist"
                }
            }
        }
        EOF
        
        # Create settings.gradle
        cat > android/settings.gradle << 'EOF'
        rootProject.name = 'SagePredictor'
        include ':app'
        EOF
        
        # Create gradle.properties
        cat > android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
        android.useAndroidX=true
        android.enableJetifier=true
        hermesEnabled=false
        EOF

    - name: Create Java source files
      run: |
        mkdir -p android/app/src/main/java/com/sagepredictor
        
        # Create MainActivity.java
        cat > android/app/src/main/java/com/sagepredictor/MainActivity.java << 'EOF'
        package com.sagepredictor;
        
        import com.facebook.react.ReactActivity;
        
        public class MainActivity extends ReactActivity {
          @Override
          protected String getMainComponentName() {
            return "SagePredictor";
          }
        }
        EOF
        
        # Create MainApplication.java
        cat > android/app/src/main/java/com/sagepredictor/MainApplication.java << 'EOF'
        package com.sagepredictor;
        
        import android.app.Application;
        import com.facebook.react.PackageList;
        import com.facebook.react.ReactApplication;
        import com.facebook.react.ReactNativeHost;
        import com.facebook.react.ReactPackage;
        import com.facebook.soloader.SoLoader;
        import java.util.List;
        
        public class MainApplication extends Application implements ReactApplication {
        
          private final ReactNativeHost mReactNativeHost = new ReactNativeHost(this) {
            @Override
            public boolean getUseDeveloperSupport() {
              return false;
            }
        
            @Override
            protected List<ReactPackage> getPackages() {
              List<ReactPackage> packages = new PackageList(this).getPackages();
              return packages;
            }
        
            @Override
            protected String getJSMainModuleName() {
              return "index";
            }
          };
        
          @Override
          public ReactNativeHost getReactNativeHost() {
            return mReactNativeHost;
          }
        
          @Override
          public void onCreate() {
            super.onCreate();
            SoLoader.init(this, false);
          }
        }
        EOF

    - name: Create app icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        
        sudo apt-get update
        sudo apt-get install -y imagemagick
        
        convert -size 512x512 xc:#4CAF50 -pointsize 400 -fill white -gravity center -annotate +0+0 "S" /tmp/ic_launcher_base.png
        
        convert /tmp/ic_launcher_base.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        convert /tmp/ic_launcher_base.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        convert /tmp/ic_launcher_base.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        convert /tmp/ic_launcher_base.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        convert /tmp/ic_launcher_base.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        
        cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

    - name: Create strings.xml
      run: |
        mkdir -p android/app/src/main/res/values
        cat > android/app/src/main/res/values/strings.xml << 'EOF'
        <resources>
            <string name="app_name">Sage Predictor</string>
        </resources>
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.sagepredictor">
        
            <uses-permission android:name="android.permission.INTERNET" />
        
            <application
              android:name=".MainApplication"
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:allowBackup="false"
              android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:label="@string/app_name"
                android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                android:launchMode="singleTask"
                android:windowSoftInputMode="adjustResize"
                android:exported="true">
                <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
        </manifest>
        EOF

    - name: Create Gradle wrapper files
      run: |
        cd android
        mkdir -p gradle/wrapper
        
        wget -q https://raw.githubusercontent.com/gradle/gradle/v7.6.4/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        
        cat > gradle/wrapper/gradle-wrapper.properties << EOF
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.4-all.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        cat > gradlew << 'EOF'
        #!/bin/sh
        APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit
        CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
        exec "$JAVA_HOME/bin/java" "-Dorg.gradle.appname=gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        
        chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Create keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias sage-key -keyalg RSA -keysize 2048 -validity 10000 -storepass sage2024 -keypass sage2024 -dname "CN=Sage Predictor, OU=Dev, O=Sage, L=City, S=State, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew clean
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sage-predictor-release

        path: android/app/build/outputs/apk/release/app-release.apk
