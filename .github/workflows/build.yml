name: Android 14 Compatible APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Create simple App for Android 14
      run: |
        cat > src/App.js << 'EOF'
        import React from 'react';
        import { View, Text, StyleSheet, SafeAreaView } from 'react-native';
        
        const App = () => {
          return (
            <SafeAreaView style={styles.container}>
              <View style={styles.content}>
                <Text style={styles.title}>🧙 Sage Predictor</Text>
                <Text style={styles.subtitle}>Android 14 Compatible</Text>
                <View style={styles.card}>
                  <Text style={styles.cardText}>✅ App is running!</Text>
                  <Text style={styles.cardText}>✅ Android 14 Samsung</Text>
                  <Text style={styles.cardText}>✅ All permissions OK</Text>
                </View>
              </View>
            </SafeAreaView>
          );
        };
        
        const styles = StyleSheet.create({
          container: {
            flex: 1,
            backgroundColor: '#0a0a0a',
          },
          content: {
            flex: 1,
            justifyContent: 'center',
            alignItems: 'center',
            padding: 20,
          },
          title: {
            fontSize: 36,
            fontWeight: 'bold',
            color: '#4CAF50',
            marginBottom: 10,
          },
          subtitle: {
            fontSize: 16,
            color: '#888',
            marginBottom: 40,
          },
          card: {
            backgroundColor: '#1a1a1a',
            padding: 30,
            borderRadius: 15,
            borderLeftWidth: 5,
            borderLeftColor: '#4CAF50',
          },
          cardText: {
            fontSize: 18,
            color: '#fff',
            marginBottom: 12,
          },
        });
        
        export default App;
        EOF

    - name: Create Metro config
      run: |
        cat > metro.config.js << 'EOF'
        const {getDefaultConfig, mergeConfig} = require('@react-native/metro-config');
        module.exports = mergeConfig(getDefaultConfig(__dirname), {});
        EOF

    - name: Create Android 14 build files
      run: |
        cat > android/build.gradle << 'EOF'
        buildscript {
            ext {
                buildToolsVersion = "34.0.0"
                minSdkVersion = 24
                compileSdkVersion = 34
                targetSdkVersion = 34
                ndkVersion = "25.1.8937393"
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath('com.android.tools.build:gradle:8.1.1')
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url "$rootDir/../node_modules/react-native/android" }
                maven { url "$rootDir/../node_modules/jsc-android/dist" }
            }
        }
        EOF
        
        cat > android/settings.gradle << 'EOF'
        rootProject.name = 'SagePredictor'
        include ':app'
        EOF
        
        cat > android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        android.useAndroidX=true
        android.enableJetifier=true
        android.defaults.buildfeatures.buildconfig=true
        android.nonTransitiveRClass=false
        android.nonFinalResIds=false
        EOF

    - name: Create app/build.gradle for Android 14
      run: |
        cat > android/app/build.gradle << 'EOF'
        apply plugin: "com.android.application"
        
        android {
            namespace "com.sagepredictor"
            compileSdkVersion 34
            buildToolsVersion "34.0.0"
            
            defaultConfig {
                applicationId "com.sagepredictor"
                minSdkVersion 24
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }
            
            signingConfigs {
                debug {
                    storeFile file('debug.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
            
            buildTypes {
                debug {
                    signingConfig signingConfigs.debug
                }
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
            
            packagingOptions {
                pickFirst 'lib/x86/libc++_shared.so'
                pickFirst 'lib/x86_64/libc++_shared.so'
                pickFirst 'lib/armeabi-v7a/libc++_shared.so'
                pickFirst 'lib/arm64-v8a/libc++_shared.so'
            }
        }
        
        dependencies {
            implementation fileTree(dir: "libs", include: ["*.jar"])
            implementation 'com.facebook.react:react-android:0.72.6'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
            implementation 'com.facebook.soloader:soloader:0.10.5'
            implementation 'org.webkit:android-jsc:+'
        }
        EOF

    - name: Create Java files
      run: |
        mkdir -p android/app/src/main/java/com/sagepredictor
        
        cat > android/app/src/main/java/com/sagepredictor/MainActivity.java << 'EOF'
        package com.sagepredictor;
        import com.facebook.react.ReactActivity;
        
        public class MainActivity extends ReactActivity {
          @Override
          protected String getMainComponentName() {
            return "SagePredictor";
          }
        }
        EOF
        
        cat > android/app/src/main/java/com/sagepredictor/MainApplication.java << 'EOF'
        package com.sagepredictor;
        
        import android.app.Application;
        import com.facebook.react.ReactApplication;
        import com.facebook.react.ReactNativeHost;
        import com.facebook.react.ReactPackage;
        import com.facebook.react.shell.MainReactPackage;
        import com.facebook.soloader.SoLoader;
        import java.util.Arrays;
        import java.util.List;
        
        public class MainApplication extends Application implements ReactApplication {
          private final ReactNativeHost mReactNativeHost = new ReactNativeHost(this) {
            @Override
            public boolean getUseDeveloperSupport() { return false; }
            @Override
            protected List<ReactPackage> getPackages() {
              return Arrays.asList(new MainReactPackage());
            }
            @Override
            protected String getJSMainModuleName() { return "index"; }
          };
          
          @Override
          public ReactNativeHost getReactNativeHost() { return mReactNativeHost; }
          
          @Override
          public void onCreate() {
            super.onCreate();
            SoLoader.init(this, false);
          }
        }
        EOF

    - name: Create Android 14 compatible manifest
      run: |
        mkdir -p android/app/src/main/res/values
        echo '<resources><string name="app_name">Sage Predictor</string></resources>' > android/app/src/main/res/values/strings.xml
        
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            
            <application
                android:name=".MainApplication"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:allowBackup="false"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                android:usesCleartextTraffic="true"
                android:enableOnBackInvokedCallback="true">
                
                <activity
                    android:name=".MainActivity"
                    android:label="@string/app_name"
                    android:configChanges="keyboard|keyboardHidden|orientation|screenSize|uiMode"
                    android:launchMode="singleTask"
                    android:windowSoftInputMode="adjustResize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Create icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
        sudo apt-get update -qq && sudo apt-get install -y imagemagick
        convert -size 512x512 xc:#4CAF50 -pointsize 400 -fill white -gravity center -annotate +0+0 "S" /tmp/ic.png
        
        for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
          px="${size%:*}"; dpi="${size#*:}"
          convert /tmp/ic.png -resize ${px}x${px} android/app/src/main/res/mipmap-${dpi}/ic_launcher.png
          cp android/app/src/main/res/mipmap-${dpi}/ic_launcher.png android/app/src/main/res/mipmap-${dpi}/ic_launcher_round.png
        done

    - name: Create debug keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Bundle
      run: |
        mkdir -p android/app/src/main/assets
        npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

    - name: Setup Gradle 8.0
      run: |
        cd /tmp
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        cd $GITHUB_WORKSPACE/android
        /tmp/gradle-8.0/bin/gradle wrapper --gradle-version=8.0
        chmod +x gradlew

    - name: Build
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: android14-apk

        path: android/app/build/outputs/apk/debug/app-debug.apk
