    - name: Create Multi-API App
      run: |
        # Keep original App.js as backup
        cp src/App.js src/App.backup.original.js
        
        echo "Using original App.js with expanded team database"

    - name: Create Metro config
      run: |
        cat > metro.config.js << 'EOF'
        const {getDefaultConfig, mergeConfig} = require('@react-native/metro-config');
        module.exports = mergeConfig(getDefaultConfig(__dirname), {});
        EOF

    - name: Create Android files
      run: |
        cat > android/build.gradle << 'EOF'
        buildscript {
            ext {
                buildToolsVersion = "34.0.0"
                minSdkVersion = 24
                compileSdkVersion = 34
                targetSdkVersion = 34
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath('com.android.tools.build:gradle:8.1.1')
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url "$rootDir/../node_modules/react-native/android" }
                maven { url "$rootDir/../node_modules/jsc-android/dist" }
            }
        }
        EOF
        
        cat > android/settings.gradle << 'EOF'
        rootProject.name = 'SagePredictor'
        include ':app'
        EOF
        
        cat > android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4096m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
        cat > android/app/build.gradle << 'EOF'
        apply plugin: "com.android.application"
        android {
            namespace "com.sagepredictor"
            compileSdkVersion 34
            defaultConfig {
                applicationId "com.sagepredictor"
                minSdkVersion 24
                targetSdkVersion 34
                versionCode 4
                versionName "4.0-MEGA"
            }
            signingConfigs {
                release {
                    storeFile file('release.keystore')
                    storePassword 'sage2024'
                    keyAlias 'sage-key'
                    keyPassword 'sage2024'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        dependencies {
            implementation 'com.facebook.react:react-android:0.72.6'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.facebook.soloader:soloader:0.10.5'
            implementation 'org.webkit:android-jsc:+'
        }
        EOF

    - name: Create Java
      run: |
        mkdir -p android/app/src/main/java/com/sagepredictor
        cat > android/app/src/main/java/com/sagepredictor/MainActivity.java << 'EOF'
        package com.sagepredictor;
        import com.facebook.react.ReactActivity;
        public class MainActivity extends ReactActivity {
          @Override
          protected String getMainComponentName() { return "SagePredictor"; }
        }
        EOF
        
        cat > android/app/src/main/java/com/sagepredictor/MainApplication.java << 'EOF'
        package com.sagepredictor;
        import android.app.Application;
        import com.facebook.react.ReactApplication;
        import com.facebook.react.ReactNativeHost;
        import com.facebook.react.ReactPackage;
        import com.facebook.react.shell.MainReactPackage;
        import com.facebook.soloader.SoLoader;
        import java.util.Arrays;
        import java.util.List;
        public class MainApplication extends Application implements ReactApplication {
          private final ReactNativeHost mReactNativeHost = new ReactNativeHost(this) {
            @Override
            public boolean getUseDeveloperSupport() { return false; }
            @Override
            protected List<ReactPackage> getPackages() { return Arrays.asList(new MainReactPackage()); }
            @Override
            protected String getJSMainModuleName() { return "index"; }
          };
          @Override
          public ReactNativeHost getReactNativeHost() { return mReactNativeHost; }
          @Override
          public void onCreate() {
            super.onCreate();
            SoLoader.init(this, false);
          }
        }
        EOF

    - name: Create manifest & icons
      run: |
        mkdir -p android/app/src/main/res/{values,mipmap-mdpi}
        echo '<resources><string name="app_name">Sage MEGA</string></resources>' > android/app/src/main/res/values/strings.xml
        
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:name=".MainApplication"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                android:usesCleartextTraffic="true"
                android:enableOnBackInvokedCallback="true">
                <activity
                    android:name=".MainActivity"
                    android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                    android:windowSoftInputMode="adjustResize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        sudo apt-get update -qq && sudo apt-get install -y imagemagick
        convert -size 48x48 xc:#4CAF50 -pointsize 32 -fill white -gravity center -annotate +0+0 "S" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

    - name: Create keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias sage-key -keyalg RSA -keysize 2048 -validity 10000 -storepass sage2024 -keypass sage2024 -dname "CN=Sage"

    - name: Bundle
      run: |
        mkdir -p android/app/src/main/assets
        npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

    - name: Gradle
      run: |
        cd /tmp && wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip && unzip -q gradle-8.0-bin.zip
        cd $GITHUB_WORKSPACE/android && /tmp/gradle-8.0/bin/gradle wrapper --gradle-version=8.0 && chmod +x gradlew

    - name: Build
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android && ./gradlew assembleRelease --stacktrace

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: sage-predictor-MEGA-TEAMS

        path: android/app/build/outputs/apk/release/app-release.apk
