name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Setup Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 7.6.4
        chmod +x gradlew

    - name: Create keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias sage-key -keyalg RSA -keysize 2048 -validity 10000 -storepass sage2024 -keypass sage2024 -dname "CN=Sage Predictor, OU=Dev, O=Sage, L=City, S=State, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sage-predictor-release

        path: android/app/build/outputs/apk/release/app-release.apk
